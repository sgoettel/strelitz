<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | Friedhofsregister der jüdischen Gemeinde zu Strelitz (1740–1923)</title>
  <link rel="stylesheet" href="{{ '/assets/styles.css' | url }}">
  <link rel="stylesheet" href="{{ '/assets/css/theme.css' | url }}">
  <link rel="icon" href="{{ '/favicon.ico' | url }}">
  {% if jsonld %}
  <script type="application/ld+json">{{ jsonld | safe }}</script>
  {% endif %}
</head>
{% assign layoutClass = 'layout--home' %}
<body class="{{ layoutClass }}">
  <header class="site-header" data-pagefind-ignore>
    <div class="container header-inner">
      <div class="brand">
        <a href="{{ '/' | url }}">Friedhofsregister der jüdischen Gemeinde zu Strelitz (1740–1923)</a>
      </div>
      <nav class="site-nav">
        <a href="{{ '/search/' | url }}">Suche</a>
        <a href="{{ '/entries/' | url }}">Einträge</a>
        <a href="{{ '/scan/' | url }}">Digitalisate</a>
        <a href="{{ '/downloads/' | url }}">Daten</a>
      </nav>
    </div>
  </header>
  <main class="site-main container" data-pagefind-body>
    {{ content | safe }}
  </main>
  <footer class="site-footer" data-pagefind-ignore>
    <div class="container">
      <a href="https://github.com/sgoettel/">Sebastian Göttel</a> ·
      <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a> · Built with Codex
    </div>
  </footer>
</body>
</html>
